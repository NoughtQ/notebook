name: Notebook assistant

on:
  discussion:
    types: [created]
  discussion_comment:
    types: [created]
  pull_request:
    types: [closed]
  workflow_run:
    workflows: [Notebook deploy]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  discussions: read

concurrency:
  group: notebook-assistant
  cancel-in-progress: false

jobs:
  prepare:
    if: vars.NOTE_BOT_MODE != '' && (github.event_name == 'discussion' || github.event_name == 'discussion_comment' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.prepare.outputs.ready }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r bot/requirements/runtime.txt
      - id: app
        if: vars.NOTE_BOT_MODE == 'auto' || vars.NOTE_BOT_MODE == 'mention'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.NOTE_BOT_APP_ID }}
          private-key: ${{ secrets.NOTE_BOT_APP_PRIVATE_KEY }}
      - id: prepare
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          NOTE_BOT_MODE: ${{ vars.NOTE_BOT_MODE }}
          BOT_ENABLED_AT: ${{ vars.NOTE_BOT_ENABLED_AT }}
          BOT_LOGIN: ${{ vars.NOTE_BOT_LOGIN }}
          OPENROUTER_MODEL: ${{ vars.NOTE_BOT_MODEL }}
        run: |
          python -m bot.core.run prepare --input "$GITHUB_EVENT_PATH" --output prepare.json --publish
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if jq -e '.skip == false' prepare.json >/dev/null; then echo 'ready=true' >> "$GITHUB_OUTPUT"; fi
      - if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: notebook-prepare-${{ github.run_id }}
          path: prepare.json
          retention-days: 7

  generate:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r bot/requirements/runtime.txt
      - uses: actions/download-artifact@v8
        with:
          name: notebook-prepare-${{ github.run_id }}
      - env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.NOTE_BOT_MODEL }}
        run: python -m bot.core.run generate --input prepare.json --output candidate.json
      - uses: actions/upload-artifact@v7
        with:
          name: notebook-candidate-${{ github.run_id }}
          path: candidate.json
          retention-days: 7

  verify:
    needs: [prepare, generate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r bot/requirements/runtime.txt
      - uses: actions/download-artifact@v8
        with:
          name: notebook-candidate-${{ github.run_id }}
      - run: python -m bot.core.run verify --input candidate.json --output verified.json
      - uses: actions/upload-artifact@v7
        with:
          name: notebook-verified-${{ github.run_id }}
          path: verified.json
          retention-days: 7

  publish:
    needs: [prepare, verify]
    if: vars.NOTE_BOT_MODE == 'auto' || vars.NOTE_BOT_MODE == 'mention'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r bot/requirements/runtime.txt
      - uses: actions/download-artifact@v8
        with:
          name: notebook-verified-${{ github.run_id }}
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.NOTE_BOT_APP_ID }}
          private-key: ${{ secrets.NOTE_BOT_APP_PRIVATE_KEY }}
      - env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          NOTE_BOT_MODE: ${{ vars.NOTE_BOT_MODE }}
          BOT_ENABLED_AT: ${{ vars.NOTE_BOT_ENABLED_AT }}
          BOT_LOGIN: ${{ vars.NOTE_BOT_LOGIN }}
          OPENROUTER_MODEL: ${{ vars.NOTE_BOT_MODEL }}
        run: python -m bot.core.run publish --input verified.json --output published.json --publish

  reconcile:
    needs: [prepare, publish]
    if: always() && (vars.NOTE_BOT_MODE == 'auto' || vars.NOTE_BOT_MODE == 'mention')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.NOTE_BOT_APP_ID }}
          private-key: ${{ secrets.NOTE_BOT_APP_PRIVATE_KEY }}
      - env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          NOTE_BOT_MODE: ${{ vars.NOTE_BOT_MODE }}
          BOT_LOGIN: ${{ vars.NOTE_BOT_LOGIN }}
        run: python -m bot.core.run reconcile --input "$GITHUB_EVENT_PATH" --output /tmp/notebook-reconcile.json
