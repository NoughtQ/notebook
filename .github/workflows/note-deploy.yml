name: Notebook deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notebook-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.NOTE_BOT_DEPLOY == 'enabled' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-site.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-pictures dvisvgm
      - name: Build complete site
        env:
          NOTEBOOK_PASSWORDS_YML: ${{ secrets.NOTEBOOK_PASSWORDS_YML }}
        run: |
          test -n "$NOTEBOOK_PASSWORDS_YML"
          password_file=$(mktemp)
          trap 'rm -f "$password_file"' EXIT
          printf '%s' "$NOTEBOOK_PASSWORDS_YML" > "$password_file"
          NOTEBOOK_PASSWORD_FILE="$password_file" bash scripts/build-notes.sh full /tmp/notebook-site
          python - <<'PY'
          import datetime, json, subprocess
          from pathlib import Path
          marker = {'source_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                    'built_at': datetime.datetime.now(datetime.timezone.utc).isoformat()}
          Path('/tmp/notebook-site/bot-deploy.json').write_text(json.dumps(marker) + '\n')
          PY
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.NOTE_BOT_APP_ID }}
          private-key: ${{ secrets.NOTE_BOT_APP_PRIVATE_KEY }}
      - name: Update existing gh-pages branch
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$APP_TOKEN" | base64 | tr -d '\n')"
          export GIT_AUTHOR_NAME='notebook-helper[bot]'
          export GIT_AUTHOR_EMAIL='notebook-helper[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          ghp-import --push --no-jekyll --cname note.noughtq.top --message "Deployed $(git rev-parse HEAD) with MkDocs" /tmp/notebook-site
